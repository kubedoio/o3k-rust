status_kind: authoritative-current-state

# Explicit evidence states: passed | failed | not-executed | not-proven.
# No vague "done". Evidence claims must be source-bound.

current_state:
  identity: passed
  real_cinder_volume: passed
  nova_cinder_attachment: passed
  chap_iscsi: passed
  libvirt_hotplug: passed
  detach: passed
  cleanup: passed
  foreign_state: passed
  tempest_preflight: passed
  tempest_execution: passed
  guest_device_observation: not-proven

evidence:
  real_cinder_lifecycle: >-
    Protected runs prove real Cinder 28.0.0 (Gazpacho) attachment create,
    attachment update, os-complete, Cinder-reported attached state,
    CHAP-authenticated iSCSI session, o3k-compute attach, libvirt hotplug,
    detach returning the volume to available, cleanup, and unchanged foreign
    state. Deterministic Cinder 28 compatibility closure (PR #501) added gates
    A/B/C/E and the machine-readable interaction spec
    (contracts/cinder/attachment-interaction-v28.yaml) and golden transcript
    (tests/real-cinder-evidence/cinder-attachment-golden-transcript.yaml).
  tempest_preflight: >-
    Deterministic portable preflight (tests/tempest-preflight.sh) proves, in
    ordinary CI without KVM/libvirt/real Cinder, a dedicated tempest 46.0.0 +
    cinder-tempest-plugin 1.21.0 venv with exact versions, stestr/subunit
    tooling, valid .stestr.conf + tempest.conf, stestr discovery of every
    allowlisted test, and the subunit -> JUnit -> summary evidence pipeline.
  tempest_execution: >-
    The allowlisted volume subset (volume create/show/update/delete and
    volume list-with-details) was executed against the live profile and
    passes. The identity token test is explicitly excluded from the
    allowlist: it issues an unscoped token, while the O3K profile requires
    project-scoped tokens (exclusion commit on main, audit record in
    tests/tempest-evidence/tempest-test-audit.yaml).
  guest_device_observation: >-
    The in-guest serial-console marker is unreliable on the test host; it is
    diagnostic-only and never promoted to passed. Guest-level consumption proof
    belongs to #435 / an explicit guest-consumption test.

blockers:
  - none for the accepted profile; the protected runner is now a verification
    environment, not a requirements-discovery environment.

next_protected_run:
  intent: verification-run
  proves:
    - Gate B real-Cinder lifecycle still passes on the exact source commit
    - Gate C Tempest subset executes the allowlisted volume tests against the
      live profile and produces JUnit + summary evidence
    - lifecycle and Tempest verdicts remain independent
