resources:
  openstack_compute_keypair_v2:
    attribute_subset:
      required: [name, public_key]
      computed_for_convergence: [id, fingerprint, region, user_id]
      deferred: [private_key]
      unsupported: [provider_generated_private_key]
    operations:
      create: {method: POST, path: "/v2.1/{project_id}/os-keypairs", status: 200}
      read: {method: GET, path: "/v2.1/{project_id}/os-keypairs/{name}", status: 200}
      delete: {method: DELETE, path: "/v2.1/{project_id}/os-keypairs/{name}", status: 202}
      update: {status: not_applicable, reason: provider_has_no_update}
      import: {id: keypair_name, first_request: GET}
    current_o3k: provider-partial
    evidence_status: observed-create-read; full lifecycle remains P13.2
  openstack_networking_network_v2:
    attribute_subset:
      required: [name]
      optional_bounded: [admin_state_up]
      computed_for_convergence: [id, status, tenant_id, mtu, subnets]
      deferred: [shared, external, provider_network_type, provider_physical_network, provider_segmentation_id]
    operations:
      create: {method: POST, path: /v2.0/networks, status: 201}
      read: {method: GET, path: "/v2.0/networks/{id}", status: 200}
      update: {method: PUT, path: "/v2.0/networks/{id}", status: 200}
      delete: {method: DELETE, path: "/v2.0/networks/{id}", status: 204}
      import: {id: network_uuid, first_request: GET}
    current_o3k: provider-partial
    evidence_status: observed-create-read; full lifecycle remains P13.2
    observed:
      - {method: POST, path: /v2.0/networks, status: 201, response: network envelope with id/name/status}
      - {method: GET, path: "/v2.0/networks/{id}", status: 200, response: network envelope}
    remaining_gap:
      classification: provider-partial
      required_implementation: complete update/delete/import convergence; no P13.1D runtime fix permitted
      evidence_reference: target/p13-1/provider-contract.json
  openstack_networking_subnet_v2:
    attribute_subset:
      required: [network_id, cidr, ip_version]
      optional_bounded: [name, gateway_ip, enable_dhcp]
      computed_for_convergence: [id, tenant_id, allocation_pools, dns_nameservers, host_routes]
      deferred: [allocation_pool, ipv6_address_mode, ipv6_ra_mode]
    cardinality:
      decision: accepted-zero-to-many-addressrealms-owned-by-independent-network
      p13_v1_target: one subnet and one AddressPool per Network
      second_subnet_admission:
        invariant: reject before canonical or provider mutation
        classification: unsupported-profile-cardinality-conflict
        proposed_status: 409
        wire_message: implementation-contract-requirement; verify during P13.2 conformance
      reason: NetworkIntent currently requires one AddressRealm, while compatibility NetworkRecord exists independently; a truthful addressless canonical NetworkIntent and durable realm deletion semantics require an accepted architecture amendment
      recommended_model: zero-or-many AddressRealms owned by canonical Network, with P13 v1 admission limited to one
      alternatives_considered:
        - zero-or-one AddressRealm: smallest P13 change, less extensible
        - zero-or-many AddressRealms: preserves P11 realm identity and future multiple-subnet support
        - distinct canonical subnet resource: clean separation, larger new domain surface
      required_authority_change: satisfied by accepted ADR-0176 and SPEC-0033; canonical runtime and restart proof are complete in P13.1F3
    operations:
      create: {method: POST, path: /v2.0/subnets, status: 201}
      read: {method: GET, path: "/v2.0/subnets/{id}", status: 200}
      update: {method: PUT, path: "/v2.0/subnets/{id}", status: 200}
      delete: {method: DELETE, path: "/v2.0/subnets/{id}", status: 204}
      import: {id: subnet_uuid, first_request: GET}
    current_o3k: provider-partial
    evidence_status: provider-blocked-at-create; canonical realm lifecycle independently proven
    observed:
      request: {method: POST, path: /v2.0/subnets, fields: [network_id, cidr, ip_version, enable_dhcp]}
      response: {status: 400, message: "invalid subnet request"}
      reason: provider omits name; current O3K compatibility handler forwards an empty name and rejects it
    remaining_gap:
      classification: wrong-request-semantics
      required_implementation: define provider-compatible subnet name/default semantics only after canonical architecture amendment; no P13.1D runtime fix permitted
      evidence_reference: target/p13-1/provider-contract.json
  openstack_networking_port_v2:
    attribute_subset:
      required: [network_id]
      optional_bounded: [name, admin_state_up, fixed_ip, no_fixed_ip]
      computed_for_convergence: [id, mac_address, fixed_ips, status, tenant_id]
      deferred: [security_groups, device_id, device_owner, allowed_address_pairs, binding_profile]
    operations:
      create: {method: POST, path: /v2.0/ports, status: 201}
      read: {method: GET, path: "/v2.0/ports/{id}", status: 200}
      update: {method: PUT, path: "/v2.0/ports/{id}", status: 200}
      delete: {method: DELETE, path: "/v2.0/ports/{id}", status: 204}
      import: {id: port_uuid, first_request: GET}
    fixed_ip: provider_accepts_subnet_id_and_optional_ip_address
    security_groups: deferred_to_p13.3
    current_o3k: provider-partial
    evidence_status: provider-blocked-by-subnet-create; canonical endpoint lifecycle independently proven
    observed:
      request: {method: POST, path: /v2.0/ports, fields: [network_id, name]}
      response: {status: 404, message: "network resource was not found"}
      reason: discovery-only network reference had no successfully created subnet; O3K port allocation requires a subnet
    remaining_gap:
      classification: dependency-blocked
      required_implementation: rerun after canonical subnet architecture and provider-compatible subnet creation are implemented; security groups remain P13.3
      evidence_reference: target/p13-1/provider-contract.json
  openstack_compute_instance_v2:
    attribute_subset:
      required: [name, image_id, flavor_id, network.uuid]
      optional_bounded: [key_pair, config_drive, metadata, user_data, power_state]
      computed_for_convergence: [id, status, access_ip_v4, addresses, created, updated, tenant_id, flavor, image]
      deferred: [personality, block_device, scheduler_hints, security_groups, floating_ip, availability_zone, user_data_secret_variants]
    operations:
      create: {method: POST, path: "/v2.1/{project_id}/servers", status: 202}
      poll: {method: GET, path: "/v2.1/{project_id}/servers/{id}", terminal_success: [ACTIVE], terminal_failure: [ERROR, UNKNOWN]}
      read: {method: GET, path: "/v2.1/{project_id}/servers/{id}", status: 200}
      update: {method: PUT, path: "/v2.1/{project_id}/servers/{id}", status: 200, bounded: [name]}
      actions: {method: POST, path: "/v2.1/{project_id}/servers/{id}/action", verbs: [start, stop, reboot]}
      delete: {method: DELETE, path: "/v2.1/{project_id}/servers/{id}", status: 204}
      import: {id: server_uuid, first_request: GET}
    operation_authority: Nova wire state; never an O3K native Operation response
    current_o3k: provider-partial
    evidence_status: provider-blocked-at-Nova-create; canonical network/realm resolution independently proven
    observed:
      prerequisite: {method: GET, path: /v2.0/networks, query: "id={network_id}&status=ACTIVE", status: 200}
      create: {method: POST, path: "/v2.1/{project_id}/servers", status: 404, message: "network resource was not found"}
    remaining_gap:
      classification: wrong-cross-service-resolution
      required_implementation: resolve network identity/resource visibility for Nova create and continue source-defined polling discovery; no P13.1D runtime fix permitted
      evidence_reference: target/p13-1/provider-contract.json
dependency_graph:
  - [image_data_source, instance]
  - [flavor_data_source, instance]
  - [network, subnet]
  - [network, port]
  - [subnet, port]
  - [port, instance]
  - [keypair, instance]

architecture_decision:
  network_without_subnet:
    current_compatibility_projection: network_networks is independently persisted and can exist without network_subnets
    current_canonical_model: canonical Network is independent and reconstructs with zero or more AddressRealms
    decision: accepted-independent-network-zero-to-many-realms
    p13_2_gate: P13.1F implementation evidence and reconstruction/migration validation
  subnet_identity:
    current_compatibility_identity: independent SubnetRecord UUID
    address_realm_identity: independent stable UUID owned by exactly one Network; P13 v1 may project Subnet ID to Realm ID
    address_pool_identity: bounded allocation range record linked to the realm/subnet
  deletion:
    current_compatibility_behavior: subnet deletion succeeds with network retained when no network ports exist; network deletion rejects remaining subnet/port rows
    canonical_requirement: realm/pool removal must leave the independent Network authoritative and reconstructable; provider cleanup must be proven first
  current_model_audit:
    network_intent: mandatory single realm in crates/o3k-domain/src/network.rs
    compatibility_persistence: independent network_networks and network_subnets tables
    reconstruction: canonical rows reconstruct Network, Realms, Pools, Endpoints, and Policies after fresh runtime creation
    accepted_resolution: ADR-0176/SPEC-0033 implemented and verified by P13.1F1/F2/F3 evidence
  runtime_status:
    canonical_network_realm_separation: implemented-and-verified
    persistence_migration: implemented-and-verified
    zero_realm_reconstruction: implemented-and-verified
    policy_reconstruction: implemented-and-verified
    realm_deletion_recovery: implemented-and-verified
    provider_rediscovery: complete-with-p13-2-managed-resource-gaps
    next_prerequisite: P13.2
