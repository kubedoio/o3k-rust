schema_version: 2
matrix_version: 0.1.0-alpha.0
source_accessed: 2026-07-30
profile: testlab-alpha
target_manifest: ../../compatibility/openstack-targets.yaml
openstack_release:
  primary: {series: "2026.1", codename: Gazpacho}
  backward_compatibility: [{series: "2025.2", codename: Flamingo}]
  selection: static
entries:
  - service: identity
    operation: token_issue_password_scoped
    api_version: keystone-v3
    microversion: null
    public_sources:
      - https://docs.openstack.org/api-ref/identity/v3/index.html#password-authentication-with-scoped-token
    supported_fields:
      request: [auth.identity.password.user, auth.scope.project]
      response: [token, expires_at, project, catalog]
    known_deviations:
      - Full Keystone policy, federation, and non-password authentication are out of scope.
      - The catalog advertises only identity and the implemented image subset.
    executable_tests:
      - crates/o3k-api/tests/health.rs::keystone_password_scope_returns_signed_subject_token
      - crates/o3k-api/tests/health.rs::keystone_invalid_password_is_generic_unauthorized
      - crates/o3k-identity/src/lib.rs::tests
    status: implemented

  - service: image
    operation: image_create
    api_version: glance-v2
    microversion: null
    public_sources:
      - https://docs.openstack.org/api-ref/image/v2/index.html#create-image
    supported_fields: [name, visibility, container_format, disk_format, size, checksum]
    known_deviations:
      - Local filesystem content is the only initial backend.
    executable_tests:
      - crates/o3k-api/tests/health.rs::glance_image_lifecycle_is_project_scoped_and_immutable_after_upload
      - crates/o3k-image/src/lib.rs::tests
    status: implemented
  - service: image
    operation: image_upload
    api_version: glance-v2
    microversion: null
    public_sources:
      - https://docs.openstack.org/api-ref/image/v2/index.html#upload-binary-image-data
    supported_fields: [content, checksum]
    known_deviations:
      - Import, multi-store, and signature workflows are out of scope.
    executable_tests:
      - crates/o3k-api/tests/health.rs::glance_image_lifecycle_is_project_scoped_and_immutable_after_upload
      - crates/o3k-image/src/lib.rs::tests
    status: implemented
  - service: image
    operation: image_list
    api_version: glance-v2
    microversion: null
    public_sources:
      - https://docs.openstack.org/api-ref/image/v2/index.html#list-images
    supported_fields: [id, name, status, size, checksum]
    known_deviations: []
    executable_tests:
      - crates/o3k-api/tests/health.rs::glance_image_lifecycle_is_project_scoped_and_immutable_after_upload
    status: implemented
  - service: image
    operation: image_show
    api_version: glance-v2
    microversion: null
    public_sources:
      - https://docs.openstack.org/api-ref/image/v2/index.html#show-image-details
    supported_fields: [id, name, status, size, checksum]
    known_deviations: []
    executable_tests:
      - crates/o3k-api/tests/health.rs::glance_image_lifecycle_is_project_scoped_and_immutable_after_upload
    status: implemented
  - service: image
    operation: image_delete
    api_version: glance-v2
    microversion: null
    public_sources:
      - https://docs.openstack.org/api-ref/image/v2/index.html#delete-image
    supported_fields: [id]
    known_deviations: []
    executable_tests:
      - crates/o3k-api/tests/health.rs::glance_image_lifecycle_is_project_scoped_and_immutable_after_upload
    status: implemented

  - service: network
    operation: network_create
    api_version: neutron-v2
    microversion: null
    public_sources:
      - https://docs.openstack.org/api-ref/network/v2/index.html#create-network
    supported_fields: [name, project_id, admin_state_up]
    known_deviations:
      - Only a flat provider network is in the initial profile.
    executable_tests:
      - crates/o3k-api/tests/health.rs::neutron_network_subnet_port_lifecycle_is_deterministic
    status: implemented
  - service: network
    operation: network_list_show_delete
    api_version: neutron-v2
    microversion: null
    public_sources:
      - https://docs.openstack.org/api-ref/network/v2/index.html#list-networks
      - https://docs.openstack.org/api-ref/network/v2/index.html#show-network-details
      - https://docs.openstack.org/api-ref/network/v2/index.html#delete-network
    supported_fields: [id, name, project_id, status]
    known_deviations:
      - Routers, floating IPs, security groups, VXLAN, and DVR are out of scope.
    executable_tests:
      - crates/o3k-api/tests/health.rs::neutron_network_subnet_port_lifecycle_is_deterministic
    status: implemented
  - service: subnet_create
    operation: subnet_create
    api_version: neutron-v2
    microversion: null
    public_sources:
      - https://docs.openstack.org/api-ref/network/v2/index.html#create-subnet
    supported_fields: [name, network_id, project_id, cidr, gateway_ip, allocation_pools]
    known_deviations:
      - One subnet and one allocation pool are supported per network in the initial profile.
    executable_tests:
      - crates/o3k-api/tests/health.rs::neutron_network_subnet_port_lifecycle_is_deterministic
    status: implemented
  - service: subnet
    operation: subnet_list_show_delete
    api_version: neutron-v2
    microversion: null
    public_sources:
      - https://docs.openstack.org/api-ref/network/v2/index.html#list-subnets
      - https://docs.openstack.org/api-ref/network/v2/index.html#show-subnet-details
      - https://docs.openstack.org/api-ref/network/v2/index.html#delete-subnet
    supported_fields: [id, name, network_id, project_id, cidr, gateway_ip]
    known_deviations: []
    executable_tests:
      - crates/o3k-api/tests/health.rs::neutron_network_subnet_port_lifecycle_is_deterministic
    status: implemented

  - service: port
    operation: port_list_show_create_delete
    api_version: neutron-v2
    microversion: null
    public_sources:
      - https://docs.openstack.org/api-ref/network/v2/index.html#ports
    supported_fields: [id, name, network_id, project_id, fixed_ips, status]
    known_deviations:
      - Ports receive one deterministic IPv4 address; device owners, security groups, and updates are out of scope.
    executable_tests:
      - crates/o3k-api/tests/health.rs::neutron_network_subnet_port_lifecycle_is_deterministic
    status: implemented

  - service: compute
    operation: keypair_import_list_show_delete
    api_version: nova-v2.1
    microversion: null
    public_sources:
      - https://docs.openstack.org/api-ref/compute/#keypairs-keypairs
      - https://docs.openstack.org/python-openstackclient/latest/cli/command-objects/keypair.html
    supported_fields: [id, name, user_id, type, public_key, fingerprint, created_at]
    known_deviations:
      - Public-key import is supported; private-key generation and private-key responses are intentionally unsupported.
      - Keypairs are scoped to the authenticated user and project.
      - The alpha response uses a durable epoch-seconds creation timestamp and UUID identity rather than Nova's legacy integer/timestamp presentation.
    executable_tests:
      - crates/o3k-store/src/lib.rs::tests::keypairs_are_scoped_unique_and_survive_restart
      - crates/o3k-api/tests/health.rs::nova_server_lifecycle_uses_project_scoped_envelopes
    status: implemented
  - service: compute
    operation: flavor_create
    api_version: nova-v2.1
    microversion: null
    public_sources:
      - https://docs.openstack.org/api-ref/compute/#flavors-os-flavors
    supported_fields: [id, name, vcpus, ram, disk]
    known_deviations:
      - Flavor extra specifications and administrative extensions are out of scope.
    executable_tests: []
    status: planned
  - service: compute
    operation: flavor_list_show_delete
    api_version: nova-v2.1
    microversion: null
    public_sources:
      - https://docs.openstack.org/api-ref/compute/#list-flavors
      - https://docs.openstack.org/api-ref/compute/#show-flavor-details
      - https://docs.openstack.org/api-ref/compute/#show-flavor-details
    supported_fields: [id, name, vcpus, ram, disk]
    known_deviations:
      - The initial catalog is read-only; flavor administration and deletion are out of scope.
    executable_tests:
      - crates/o3k-api/tests/health.rs::nova_server_lifecycle_uses_project_scoped_envelopes
    status: implemented
  - service: compute
    operation: server_create
    api_version: nova-v2.1
    microversion: null
    public_sources:
      - https://docs.openstack.org/api-ref/compute/#create-server
    supported_fields: [name, image, flavor, networks, key_name, project_id]
    known_deviations:
      - Guest key injection, metadata extensions, config-drive, and scheduler extensions are out of scope.
    executable_tests:
      - crates/o3k-api/tests/health.rs::nova_server_lifecycle_uses_project_scoped_envelopes
    status: implemented
  - service: compute
    operation: server_list_show_delete
    api_version: nova-v2.1
    microversion: null
    public_sources:
      - https://docs.openstack.org/api-ref/compute/#list-servers
      - https://docs.openstack.org/api-ref/compute/#show-server-details
      - https://docs.openstack.org/api-ref/compute/#delete-server
    supported_fields: [id, name, status, image, flavor, addresses, project_id]
    known_deviations:
      - Pagination and the broader Nova query/filter surface are deferred.
    executable_tests:
      - crates/o3k-api/tests/health.rs::nova_server_lifecycle_uses_project_scoped_envelopes
    status: implemented
  - service: compute
    operation: server_start_stop_reboot
    api_version: nova-v2.1
    microversion: null
    public_sources:
      - https://docs.openstack.org/api-ref/compute/#start-server
      - https://docs.openstack.org/api-ref/compute/#stop-server
      - https://docs.openstack.org/api-ref/compute/#reboot-server
    supported_fields: [server_id, reboot_type]
    known_deviations:
      - Hard reboot and soft reboot are mapped by the provider contract; hypervisor-specific behavior is not exposed.
    executable_tests:
      - crates/o3k-api/tests/health.rs::nova_server_lifecycle_uses_project_scoped_envelopes
    status: implemented
