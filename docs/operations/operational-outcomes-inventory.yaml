    {
      "id": "OP-003",
      "name": "systemd service lifecycle",
      "requirement": "The daemon runs as a dedicated non-root system user under systemd with automatic restart, secrets supplied through a protected environment file rather than the unit, and hardening that keeps the data and log directories writable while protecting the rest of the system.",
      "go_behavior": "The Go o3k.service uses Type=simple and Restart=on-failure, but embeds O3K_ADMIN_PASSWORD in Environment= lines of the unit (a world-readable leak) and hard-couples to libvirtd with Requires=libvirtd.service. The reference lightstack unit shows the intended hardening pattern (EnvironmentFile, ProtectSystem=strict, ReadWritePaths).",
      "go_paths_consulted": [
        "scripts/install.sh",
        "deployments/systemd/lightstack.service"
      ],
      "rust_status": "implemented",
      "rust_owner": "packaging/ (o3kd.service, o3k-compute.service, install.sh)",
      "profile": "native-rust-testlab",
      "evidence": [
        "packaging/o3kd.service",
        "packaging/o3k-compute.service",
        "packaging/install.sh"
      ],
      "gap": "none: the Rust units use EnvironmentFile=-/etc/o3k/o3kd.env (0600, no secret in the unit), User/Group=o3k, Restart=on-failure, and hardening (NoNewPrivileges, ProtectSystem=strict, ReadWritePaths); the Go reference leaks the admin password in Environment=.",
      "priority": "intentionally-omitted",
      "requires_before_implementation": [
