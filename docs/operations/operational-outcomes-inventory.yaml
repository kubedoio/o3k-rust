      "go_behavior": "The Go installer is a curl|sh script with preflight checks, downloads a checksum-verified binary, writes /etc/o3k/config.yaml with mode 600, installs a systemd unit, the OpenStack CLI, and optionally Horizon. A package-based install is also documented.",
      "go_paths_consulted": [
        "scripts/install.sh",
        "scripts/bootstrap.sh",
        "docs/INSTALLATION.md"
      ],
