    {
      "id": "OP-001",
      "name": "zero-config first start",
      "requirement": "An operator starts o3kd with no arguments and gets a usable control plane: safe loopback defaults, a data directory, and no silently unauthenticated state. On first start the daemon must either provision identity credentials itself or clearly tell the operator that token authentication is disabled and how to enable it. Credentials, once present, must be reused across restarts.",
      "go_behavior": "Running ./o3k with no arguments boots everything: it creates the data directory, auto-generates jwt-secret, initial-password, and agent-token files with mode 0600, creates the SQLite database, seeds the admin user, and prints a banner. O3K_DATA_DIR overrides the data location and the generated secrets are reused across restarts.",
      "go_paths_consulted": [
        "cmd/o3k/main.go",
        "internal/server/bootstrap.go",
        "config/o3k.yaml",
        "README.md"
      ],
      "rust_status": "partial",
      "rust_owner": "bins/o3kd, crates/o3k-config",
      "profile": "native-rust-testlab",
      "evidence": [
        "crates/o3k-config/src/lib.rs",
        "bins/o3kd/src/main.rs",
        "docs/CONFIGURATION.md"
      ],
      "gap": "Safe defaults exist (127.0.0.1:8080, ./data, fake provider) and o3kd now warns that identity is not configured, but credentials are not auto-generated: the operator must run scripts/generate-passwords.sh or set O3K_BOOTSTRAP_PASSWORD/O3K_TOKEN_SIGNING_KEY.",
      "priority": "useful-later",
      "requires_before_implementation": [
        "decision/spec on first-run credential generation vs documented script step"
      ]
    },
