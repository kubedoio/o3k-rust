openapi: 3.1.2
x-o3k-openapi-policy:
  target: 3.1.2
  status: target
x-o3k-baseline:
  path: docs/specs/testlab-api-baseline.json
  status: partial
  coverage: native-iam
info:
  title: O3K Native IAM API
  version: 0.1.0
  description: >-
    The versioned native O3K IAM ingress. This contract covers the bounded
    password/token/federated exchange, canonical AuthContext projection, and
    operator-console probe. It does not advertise OpenStack parity.
servers:
  - url: http://127.0.0.1:8080/o3k/v1
security: []
paths:
  /identity/tokens:
    post:
      operationId: issueNativeToken
      summary: Issue a native O3K token
      description: >-
        Issues a native token from exactly one supported credential form.
        Federated project exchange is bounded by the validated external
        identity expiry. System exchange requires an explicit durable
        operator-console assignment and never accepts a caller-selected role.
        The native API limits request bodies to 1 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeTokenRequest'
            examples:
              projectFederated:
                $ref: '#/components/examples/ProjectFederatedRequest'
              systemOperator:
                $ref: '#/components/examples/SystemOperatorRequest'
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '201':
          description: Native token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/NotAvailable'
  /identity/me:
    get:
      operationId: getNativeIdentityContext
      summary: Read the canonical authenticated context
      parameters:
        - $ref: '#/components/parameters/RequestId'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Public-safe canonical principal and effective scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /identity/scopes:
    post:
      operationId: discoverFederatedScopes
      summary: Discover project scopes for a federated identity
      description: >-
        Returns only currently enabled project assignments for the validated
        external identity. The external access token is used for this request
        only and is never returned or persisted by O3K.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [federated]
              properties:
                federated:
                  type: object
                  additionalProperties: false
                  required: [access_token]
                  properties:
                    access_token: {type: string, minLength: 1, maxLength: 8192, writeOnly: true}
      responses:
        '200':
          description: Public-safe discoverable project scopes.
          content:
            application/json:
              schema:
                type: object
                required: [scopes]
                properties:
                  scopes:
                    type: array
                    items: {$ref: '#/components/schemas/DiscoverableScope'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/NotAvailable'
  /operator/profile:
    get:
      operationId: getOperatorProfile
      summary: Read the bounded operator-console profile
      description: >-
        This is a server-authorized probe only. It does not grant shell,
        host, data-plane, or arbitrary system mutation access.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The authenticated operator profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /operator/governance/projects:
    get:
      operationId: listGovernanceProjects
      summary: List canonical O3K projects
      description: >-
        Bounded page of canonical durable projects ordered by stable id. Every
        route requires the system-scoped governance:ReadGovernance action plus
        the durable operator role; a project-scoped caller is denied even when
        it holds an operator-named project role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A bounded page of canonical projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/NotAvailable'
  /operator/governance/projects/{id}:
    get:
      operationId: getGovernanceProject
      summary: Read one canonical O3K project
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          description: Canonical project identifier.
          schema: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: The canonical project view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/NotAvailable'
  /operator/governance/principals:
    get:
      operationId: listGovernancePrincipals
      summary: List canonical O3K principals
      description: >-
        Bounded page of canonical durable principals. Credential material such
        as password hashes, tokens, private keys, and service secrets is
        structurally absent from the projection.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A bounded page of canonical principals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/NotAvailable'
  /operator/governance/principals/{id}:
    get:
      operationId: getGovernancePrincipal
      summary: Read one canonical O3K principal
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          description: Canonical principal identifier.
          schema: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: The canonical principal view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/NotAvailable'
  /operator/governance/roles:
    get:
      operationId: listGovernanceRoles
      summary: List canonical O3K roles
      description: >-
        Bounded page of canonical role identity. Role names are display
        identity only; permissions must be read from the capabilities
        inventory, never inferred from role names.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A bounded page of canonical roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/NotAvailable'
  /operator/governance/capabilities:
    get:
      operationId: listGovernanceCapabilities
      summary: List the canonical authorization action inventory
      description: >-
        Projects the kernel Authorizer policy inventory so clients never infer
        permissions from role display names. This is a single canonical
        inventory, not a keyset-paginated collection, and has no limit or
        cursor parameters.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The canonical capability inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/NotAvailable'
  /operator/governance/assignments:
    get:
      operationId: listGovernanceAssignments
      summary: List canonical project membership assignments
      description: >-
        Bounded page of canonical (principal, project, role) assignments,
        optionally filtered by any of the three references. Filters are bound
        into the opaque cursor identity.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ProjectIdFilter'
        - $ref: '#/components/parameters/PrincipalIdFilter'
        - $ref: '#/components/parameters/RoleIdFilter'
      responses:
        '200':
          description: A bounded page of canonical role assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/NotAvailable'
    post:
      operationId: createGovernanceAssignment
      summary: Create a canonical project membership assignment
      description: >-
        Idempotently creates the canonical assignment after validating that the
        referenced principal, project, and role exist and are enabled. A
        replay of an identical assignment returns the existing canonical
        assignment and creates no new authority. Requires the system-scoped
        governance:ManageAssignment action.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreate'
      responses:
        '200':
          description: The existing or newly created canonical assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/NotAvailable'
  /operator/governance/assignments/{id}:
    delete:
      operationId: deleteGovernanceAssignment
      summary: Delete a canonical project membership assignment
      description: >-
        Removes the referenced canonical assignment and returns 204. An absent
        assignment is RESOURCE_NOT_FOUND. Requires the system-scoped
        governance:ManageAssignment action.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          description: Canonical assignment identifier.
          schema: {type: string, minLength: 1, maxLength: 256}
      responses:
        '204':
          description: The assignment was removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/NotAvailable'
  /operator/governance/operator-assignments:
    get:
      operationId: listGovernanceOperatorAssignments
      summary: List canonical durable operator assignments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A bounded page of canonical operator assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorAssignmentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/NotAvailable'
    post:
      operationId: createGovernanceOperatorAssignment
      summary: Create a canonical durable operator assignment
      description: >-
        Idempotently grants the recognized operator-console profile after
        validating that the principal exists and is enabled. This is a distinct
        action so operator authority can never be granted through the ordinary
        assignment action. Requires the system-scoped
        governance:ManageOperatorAssignment action.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorAssignmentCreate'
      responses:
        '200':
          description: The existing or newly created canonical operator assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorAssignmentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/NotAvailable'
  /operator/governance/operator-assignments/{id}:
    delete:
      operationId: deleteGovernanceOperatorAssignment
      summary: Delete a canonical durable operator assignment
      description: >-
        Removes the referenced canonical operator assignment and returns 204.
        An absent assignment is RESOURCE_NOT_FOUND. Requires the system-scoped
        governance:ManageOperatorAssignment action.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          description: Canonical operator assignment identifier.
          schema: {type: string, minLength: 1, maxLength: 256}
      responses:
        '204':
          description: The operator assignment was removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/NotAvailable'
components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Bounded request correlation value echoed in Problem Details.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum page size (1..=200; default 50).
      schema: {type: integer, minimum: 1, maximum: 200}
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque HMAC-authenticated continuation cursor bound to the effective
        scope, collection identity, and accepted filter set.
      schema: {type: string, minLength: 1, maxLength: 4096}
    ProjectIdFilter:
      name: project_id
      in: query
      required: false
      description: Restrict assignments to one canonical project identifier.
      schema: {type: string, minLength: 1, maxLength: 256}
    PrincipalIdFilter:
      name: principal_id
      in: query
      required: false
      description: Restrict assignments to one canonical principal identifier.
      schema: {type: string, minLength: 1, maxLength: 256}
    RoleIdFilter:
      name: role_id
      in: query
      required: false
      description: Restrict assignments to one canonical role identifier.
      schema: {type: string, minLength: 1, maxLength: 256}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: O3K-native-token
  schemas:
    NativeTokenRequest:
      type: object
      additionalProperties: false
      required: [auth]
      properties:
        auth:
          oneOf:
            - $ref: '#/components/schemas/PasswordAuth'
            - $ref: '#/components/schemas/TokenAuth'
            - $ref: '#/components/schemas/ProjectFederatedAuth'
            - $ref: '#/components/schemas/SystemFederatedAuth'
    PasswordAuth:
      type: object
      additionalProperties: false
      required: [method, password]
      properties:
        method: {const: password}
        password: {$ref: '#/components/schemas/PasswordCredentials'}
    TokenAuth:
      type: object
      additionalProperties: false
      required: [method, token]
      properties:
        method: {const: token}
        token: {type: string, minLength: 1, writeOnly: true}
    ProjectFederatedAuth:
      type: object
      additionalProperties: false
      required: [method, project_id, federated]
      properties:
        method: {const: federated}
        project_id: {type: string, minLength: 1, maxLength: 255}
        federated: {$ref: '#/components/schemas/FederatedCredentials'}
    SystemFederatedAuth:
      type: object
      additionalProperties: false
      required: [method, federated]
      properties:
        method: {const: federated}
        federated:
          type: object
          additionalProperties: false
          required: [access_token, scope]
          properties:
            access_token: {type: string, minLength: 1, maxLength: 8192, writeOnly: true}
            scope:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: {const: system}
    PasswordCredentials:
      type: object
      additionalProperties: false
      required: [user_id, password]
      properties:
        user_id: {type: string, minLength: 1, maxLength: 255}
        password: {type: string, minLength: 1, maxLength: 4096, writeOnly: true}
    FederatedCredentials:
      type: object
      additionalProperties: false
      required: [access_token]
      properties:
        access_token: {type: string, minLength: 1, maxLength: 8192, writeOnly: true}
    NativeTokenResponse:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {$ref: '#/components/schemas/IssuedToken'}
    IssuedToken:
      type: object
      additionalProperties: false
      required: [id, issued_at, expires_at, project, user]
      properties:
        id: {type: string, minLength: 1, readOnly: true}
        issued_at: {type: string, format: date-time, readOnly: true}
        expires_at: {type: string, format: date-time, readOnly: true}
        project: {$ref: '#/components/schemas/ScopeProjection'}
        user: {$ref: '#/components/schemas/PrincipalProjection'}
    CurrentContext:
      type: object
      additionalProperties: false
      required: [authenticated, principal_id, principal_kind, principal_name, effective_scope_id, effective_scope_kind]
      properties:
        authenticated: {const: true}
        principal_id: {type: string, minLength: 1}
        principal_kind: {type: string, enum: [user, service]}
        principal_name: {type: string, minLength: 1}
        effective_scope_id: {type: string, minLength: 1}
        effective_scope_kind: {type: string, enum: [project, domain, system]}
    OperatorProfile:
      type: object
      additionalProperties: false
      required: [profile, scope, principal_id, audit_id]
      properties:
        profile: {const: operator-console}
        scope: {const: system}
        principal_id: {type: string, minLength: 1}
        audit_id: {type: string, minLength: 1}
    DiscoverableScope:
      type: object
      additionalProperties: false
      required: [id, kind, can_request_token]
      properties:
        id: {type: string, minLength: 1}
        kind: {type: string, enum: [project]}
        name: {type: [string, 'null']}
        domain_id: {type: [string, 'null']}
        can_request_token: {type: boolean}
    PrincipalProjection:
      type: object
      additionalProperties: false
      required: [id, name, domain]
      properties:
        id: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        domain: {$ref: '#/components/schemas/DomainProjection'}
    ScopeProjection:
      type: object
      additionalProperties: false
      required: [id, name, domain]
      properties:
        id: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        domain: {$ref: '#/components/schemas/DomainProjection'}
    DomainProjection:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code:
          type: string
          enum: [BAD_REQUEST, UNSUPPORTED_OPERATION, UNAUTHORIZED, FORBIDDEN, RESOURCE_NOT_FOUND, CONFLICT, REQUEST_TOO_LARGE, INVALID_CURSOR, UNSUPPORTED_MEDIA_TYPE, NOT_AVAILABLE, INTERNAL_ERROR]
        detail: {type: string}
        request_id: {type: string}
        resource_id: {type: string}
    ProjectView:
      type: object
      additionalProperties: false
      required: [id, domain_id, name, enabled, created_at]
      properties:
        id: {type: string, minLength: 1}
        domain_id: {type: string, minLength: 1}
        name: {type: string}
        description: {type: string}
        enabled: {type: boolean}
        created_at: {type: string, minLength: 1}
    PrincipalView:
      type: object
      additionalProperties: false
      required: [id, domain_id, name, kind, enabled, created_at]
      properties:
        id: {type: string, minLength: 1}
        domain_id: {type: string, minLength: 1}
        name: {type: string}
        kind: {type: string, enum: [user, service]}
        email: {type: string}
        enabled: {type: boolean}
        created_at: {type: string, minLength: 1}
    RoleView:
      type: object
      additionalProperties: false
      required: [id, name, created_at]
      properties:
        id: {type: string, minLength: 1}
        name: {type: string}
        description: {type: string}
        created_at: {type: string, minLength: 1}
    AssignmentView:
      type: object
      additionalProperties: false
      required: [id, principal_id, project_id, role_id, created_at]
      properties:
        id: {type: string, minLength: 1}
        principal_id: {type: string, minLength: 1}
        project_id: {type: string, minLength: 1}
        role_id: {type: string, minLength: 1}
        created_at: {type: string, minLength: 1}
    OperatorAssignmentView:
      type: object
      additionalProperties: false
      required: [id, principal_id, profile, enabled, created_at, updated_at]
      properties:
        id: {type: string, minLength: 1}
        principal_id: {type: string, minLength: 1}
        profile: {type: string, minLength: 1}
        enabled: {type: boolean}
        created_at: {type: string, minLength: 1}
        updated_at: {type: string, minLength: 1}
    CapabilityView:
      type: object
      additionalProperties: false
      required: [action, resource_type, required_roles, require_ownership]
      properties:
        action: {type: string, minLength: 1}
        resource_type: {type: string, minLength: 1}
        required_roles: {type: array, items: {type: string}}
        require_ownership: {type: boolean}
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/ProjectView'}
        has_more: {type: boolean}
        next_cursor: {type: string}
    PrincipalPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/PrincipalView'}
        has_more: {type: boolean}
        next_cursor: {type: string}
    RolePage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/RoleView'}
        has_more: {type: boolean}
        next_cursor: {type: string}
    AssignmentPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          maxItems: 200
