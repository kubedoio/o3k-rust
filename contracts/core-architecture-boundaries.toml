schema_version = 1
status = "proposed"
normative_adr = "docs/adr/ADR-0160-service-topology-and-execution-boundaries.md"
normative_spec = "docs/specs/SPEC-0025-rust-rewrite-and-architecture-convergence.md"

application_crates = [
  "o3k-identity",
  "o3k-image",
  "o3k-network",
  "o3k-compute",
  "o3k-placement",
  "o3k-scheduler",
  "o3k-reconciler",
]

# Every other workspace crate under crates/ is an infrastructure or adapter
# crate and is deliberately NOT an application crate. This list must be
# exhaustive with application_crates: the checker fails when a workspace crate
# is unclassified, so a new crate cannot silently escape the boundary checks.
# `o3k-provider` and `o3k-store` are classified non-application because they
# host the narrow ports application crates depend on (provider/agent/attachment
# ports, repository ports) plus their concrete adapters; the classification
# follows the dependency direction, not the fact that ports live there.
non_application_crates = [
  "o3k-api",
  "o3k-cellhv",
  "o3k-cinder",
  "o3k-compute-agent",
  "o3k-config",
  "o3k-config-drive",
  "o3k-console",
  "o3k-dhcp",
  "o3k-domain",
  "o3k-libvirt",
  "o3k-provider",
  "o3k-provider-contract",
  "o3k-store",
]

[domain]
crate = "o3k-domain"
allowed_dependencies = ["serde", "thiserror", "uuid"]
forbidden_source_markers = [
  "axum::",
  "sqlx::",
  "tonic::",
  "prost::",
  "hyper::",
  "o3k_api",
  "o3k_store",
  "o3k_provider",
  "o3k_provider_contract",
  "o3k_compute_agent",
  "o3k_libvirt",
  "o3k_cellhv",
  "o3k_cinder",
]

[application]
# These dependencies are adapter/framework concerns and are not valid
# application dependencies at all. The agent/Cinder adapter crates were
# removed from application crates behind bounded ports (SPEC-0025 step 6) and
# are now hard-forbidden so the debt cannot silently reappear.
hard_forbidden_dependencies = [
  "o3k-api",
  "axum",
  "sqlx",
  "hyper",
  "tonic",
  "rustls",
  "o3k-libvirt",
  "o3k-cellhv",
  "o3k-cinder",
  "o3k-compute-agent",
  "o3k-provider-contract",
  "prost",
]

# The agent/Cinder adapter dependencies previously listed here (o3k-cinder,
# o3k-compute-agent, o3k-provider-contract, prost) were fully removed behind
# bounded application ports (SPEC-0025 step 6) and are enforced by
# hard_forbidden_dependencies above; the ratcheted set is intentionally empty
# so no new application dependency on these adapters can be introduced without
# an explicit architecture review. `o3k-store` is intentionally not listed:
# application code may depend on narrow repository/store ports from that crate
# while concrete SqliteStore use is separately ratcheted below. A later
# accepted design may split ports and adapters into separate crates, but this
# contract does not force that choice.
#
# Note: the boundary checker inspects production dependencies only.
# Test-only dev-dependencies on adapter crates (for example o3k-compute's
# dev-dependency on o3k-cinder for the fake-Cinder conformance testkit) are
# permitted and are not application coupling.
ratcheted_adapter_dependencies = []

concrete_store_symbol = "SqliteStore"
# No application crate names the concrete adapter anymore: o3k-compute and
# o3k-identity depend on the narrow ComputeRepository / IdentityRepository
# ports (plus KeypairRepository, VolumeAttachmentRepository, and the existing
# DurableStore) defined in this adapter crate, and the composition root
# (o3kd) selects the SQLite adapter. The symbol check below still fails when
# any application source re-introduces the concrete store.
concrete_store_debt_files = []

[ratchet]
allow_debt_reduction = true
allow_new_debt = false
allow_broader_debt = false
