schema_version = 1
status = "proposed"
normative_adr = "docs/adr/ADR-0160-service-topology-and-execution-boundaries.md"
normative_spec = "docs/specs/SPEC-0025-rust-rewrite-and-architecture-convergence.md"

application_crates = [
  "o3k-identity",
  "o3k-image",
  "o3k-network",
  "o3k-compute",
  "o3k-placement",
  "o3k-scheduler",
  "o3k-reconciler",
]

[domain]
crate = "o3k-domain"
allowed_dependencies = ["serde", "thiserror", "uuid"]
forbidden_source_markers = [
  "axum::",
  "sqlx::",
  "tonic::",
  "prost::",
  "hyper::",
  "o3k_api",
  "o3k_store",
  "o3k_provider",
  "o3k_provider_contract",
  "o3k_compute_agent",
  "o3k_libvirt",
  "o3k_cellhv",
  "o3k_cinder",
]

[application]
# These dependencies are adapter/framework concerns and are not valid
# application dependencies at all.
hard_forbidden_dependencies = [
  "o3k-api",
  "axum",
  "sqlx",
  "hyper",
  "tonic",
  "rustls",
  "o3k-libvirt",
  "o3k-cellhv",
]

# These dependencies currently appear in a small number of application crates.
# They are migration debt and may occur only where listed under
# adapter_dependency_debt. The allowed set must shrink rather than spread.
ratcheted_adapter_dependencies = [
  "o3k-store",
  "o3k-cinder",
  "o3k-compute-agent",
  "o3k-provider-contract",
  "prost",
]

concrete_store_symbol = "SqliteStore"
concrete_store_debt_files = [
  "crates/o3k-compute/src/lib.rs",
  "crates/o3k-compute/src/attachment.rs",
  "crates/o3k-identity/src/lib.rs",
]

[application.adapter_dependency_debt]
# The current store crate contains both repository contracts and the concrete
# SQLite adapter. Application dependencies on it are migration debt until
# narrow ports move inward and SQLite remains selected only at composition.
o3k-identity = [
  "o3k-store",
]

# o3k-compute currently contains persistence, execution, wire, and
# external-service adapter coupling that should move behind bounded
# application ports. These are accepted as current migration debt only.
o3k-compute = [
  "o3k-store",
  "o3k-cinder",
  "o3k-compute-agent",
  "o3k-provider-contract",
  "prost",
]

# o3k-reconciler currently depends on the store adapter crate and reads agent
# wire events directly. Both should converge toward application/domain ports
# and typed observations.
o3k-reconciler = [
  "o3k-store",
  "o3k-provider-contract",
]

[ratchet]
allow_debt_reduction = true
allow_new_debt = false
allow_broader_debt = false
