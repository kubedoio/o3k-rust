[workspace]
members = [
    "bins/o3kd",
    "crates/o3k-api",
    "crates/o3k-config",
    "crates/o3k-domain",
    "crates/o3k-identity",
    "crates/o3k-image",
    "crates/o3k-network",
    "crates/o3k-provider",
    "crates/o3k-reconciler",
    "crates/o3k-provider-contract",
    "crates/o3k-compute",
    "crates/o3k-store",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/kubedoio/o3k-rust"

[workspace.dependencies]
axum = "0.8"
async-trait = "0.1"
base64 = "0.22"
hmac = "0.12"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
thiserror = "2"
time = { version = "=0.3.36", features = ["formatting", "macros"] }
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
prost = "0.13"
tonic = "0.12"
tonic-build = "0.12"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v7"] }
# Keep SQLx's URL/IDNA dependency compatible with the supported Rust 1.85 toolchain.
url = "=2.4.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
