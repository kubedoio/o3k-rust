<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="t d">
  <title id="t">O3K edge-to-datacenter scale continuum</title>
  <desc id="d">Three grid panels of increasing size use the same active-module language to show growth from edge site to datacenter without replatforming.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7DD3FC"/></marker></defs>
  <rect width="1280" height="460" rx="18" fill="#08111F"/>
  <text x="64" y="70" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#22D3EE" text-anchor="start" letter-spacing="2.2">EDGE → DATACENTER</text>
  <text x="64" y="104" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#F1F5F9" text-anchor="start">One substrate, growing outward</text>
  <text x="64" y="134" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#94A9C4" text-anchor="start">The same module language at every scale rung — growth adds panels and blocks, never a new product.</text>
