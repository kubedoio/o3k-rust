name: LLM implementation task
description: A bounded, spec-driven implementation task for coding agents
title: "[Task]: "
labels: []
body:
  - type: markdown
    attributes:
      value: Read AGENTS.md before completing this form.
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
      description: What externally observable result is required?
    validations:
      required: true
  - type: textarea
    id: specs
    attributes:
      label: Normative specs and public sources
      description: Link committed specs/contracts and public references.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use verifiable checklist items.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Required tests and failure cases
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Provenance restrictions
      description: Identify allowed public inputs and prohibited private inputs.
    validations:
      required: true
