name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: TestLab fake-provider workflow
        run: bash tests/testlab.sh
      - name: Generate candidate SBOM
        run: bash packaging/make-sbom.sh target/testlab-artifacts/sbom.spdx.json
      - name: Upload TestLab artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testlab-artifacts
          path: target/testlab-artifacts/
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: Audit Rust dependencies for vulnerabilities
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cargo audit --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2023-0071
