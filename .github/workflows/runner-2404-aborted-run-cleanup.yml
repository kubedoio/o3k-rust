name: Runner 2404 aborted-run cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    if: github.repository == 'kubedoio/o3k-rust' && github.ref == 'refs/heads/runner-2404-aborted-run-cleanup'
    runs-on: [self-hosted, linux, x64, kvm, libvirt, o3k-testlab]
    steps:
      - name: Remove exact aborted-run resources
        run: |
          set -euo pipefail
          state=/var/lib/o3k-testlab/30769531659
          venv=/home/ubuntu/actions-runner/_work/_temp/o3k-openstack-venv.f8VfL0
          export PATH="$venv/bin:$PATH" OS_AUTH_URL=http://127.0.0.1:18080/v3 OS_USERNAME=admin OS_PROJECT_NAME=admin OS_REGION_NAME=RegionOne
          export OS_PASSWORD="$(sudo -n cat "$state/.password")"
          server=0da21dac-20ce-5208-b988-38dc6b80616c
          flavor=019fc48a-f1f9-7a62-b2ec-1e34229a5311
          image=019fc48a-d814-7193-afe6-c2be93baef1d
          network=019fc48a-e28e-7be2-9fc2-2aaeef651cfa
          subnet=019fc48a-e777-76f1-a56d-ac7a117aee2d
          for _ in {1..12}; do openstack server delete --wait "$server" >/dev/null 2>&1 || true; openstack server show "$server" >/dev/null 2>&1 || break; sleep 2; done
          openstack flavor delete "$flavor" >/dev/null 2>&1 || true
          openstack image delete "$image" >/dev/null 2>&1 || true
          openstack subnet delete "$subnet" >/dev/null 2>&1 || true
          openstack network delete "$network" >/dev/null 2>&1 || true
          domain=o3k-e84d69cce2c47ce8be64
          if sudo -n virsh -c qemu:///system dominfo "$domain" >/dev/null 2>&1; then
            xml="$(sudo -n virsh -c qemu:///system dumpxml "$domain")"
            grep -Fq '<o3k:domain' <<<"$xml"; grep -Fq 'managed_by="o3k-compute"' <<<"$xml"
            sudo -n virsh -c qemu:///system destroy "$domain" >/dev/null 2>&1 || true
            sudo -n virsh -c qemu:///system undefine "$domain"
          fi
          if ip link show dev o3k-br0 >/dev/null 2>&1; then
            while IFS= read -r line; do name="${line#*: }"; name="${name%%@*}"; name="${name%%:*}"; [[ "$name" == o3k-* || "$name" == o3ktap-* ]] || exit 1; done < <(ip -o link show master o3k-br0)
            sudo -n ip link delete dev o3k-br0
          fi
