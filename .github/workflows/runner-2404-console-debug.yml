name: Runner 2404 console debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    if: github.repository == 'kubedoio/o3k-rust' && github.ref == 'refs/heads/runner-2404-console-debug-2'
    runs-on: [self-hosted, linux, x64, kvm, libvirt, o3k-testlab]
    steps:
      - name: Capture exact console evidence
        run: |
          set -euo pipefail
          out=target/console-debug
          mkdir -p "$out"
          domain=o3k-e84d69cce2c47ce8be64
          sudo -n virsh -c qemu:///system dumpxml "$domain" >"$out/domain.xml"
          sudo -n virsh -c qemu:///system qemu-monitor-command "$domain" --hmp 'info status' >"$out/status.txt" || true
          sudo -n virsh -c qemu:///system ttyconsole "$domain" >"$out/tty.txt" || true
          sudo -n find /var/lib/o3k-testlab/30773019405/data -maxdepth 5 -type f -path '*console*' -printf '%p %s bytes\n' >"$out/console-files.txt" 2>/dev/null || true
          sudo -n find /var/log/libvirt/qemu -maxdepth 1 -type f -name '*o3k*' -exec sh -c 'for f; do echo "--- $f"; tail -c 65536 "$f"; done' _ {} + >"$out/qemu.log" 2>/dev/null || true
          sudo -n ps -eo pid,args | grep qemu-system | grep o3k-e84d69cce2c47ce8be64 >"$out/process.txt" || true
      - name: Upload console evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-2404-console-debug
          path: target/console-debug
          retention-days: 2
