name: Repository identity migration

on:
  push:
    branches:
      - chore/repository-identity-migration
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: chore/repository-identity-migration
          fetch-depth: 0

      - name: Replace legacy canonical repository references outside workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          OLD = "kubedoio/o3k-rust"
          NEW = "o3kio/o3k"
          excluded_prefixes = (
              "docs/reports/",
              ".github/workflows/",
              ".git/",
          )

          changed = []
          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              rel = path.as_posix().removeprefix("./")
              if rel.startswith(excluded_prefixes):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if OLD not in text:
                  continue
              path.write_text(text.replace(OLD, NEW), encoding="utf-8")
              changed.append(rel)

          print(f"updated {len(changed)} files")
          for rel in changed:
              print(rel)
          PY

      - name: Commit migration
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes remain"
            exit 0
          fi
          git commit -m "chore: complete repository identity migration"
          git push origin HEAD:chore/repository-identity-migration
