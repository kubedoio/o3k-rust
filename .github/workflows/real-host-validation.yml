name: Real-host validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o3k-real-host-validation
  cancel-in-progress: false

jobs:
  real-host:
    name: Protected TestLab real-host validation
    if: github.repository == 'kubedoio/o3k-rust' && github.ref == 'refs/heads/main'
    timeout-minutes: 60
    # Configure this environment to require maintainer approval.
    environment: o3k-real-host-validation
    runs-on: [self-hosted, linux, x64, kvm, libvirt, o3k-testlab]
    steps:
      - name: Check out the canonical repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify immutable source checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Bootstrap disposable TestLab
        id: bootstrap
        continue-on-error: true
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_PROVIDER: agent
          O3K_AGENT_INSPECT_PROBE_ENABLED: true
          O3K_AGENT_INSPECT_PROBE_RESOURCE_FILE: ${{ github.workspace }}/target/real-host-workflow-artifacts/agent-inspect-resource-id
        run: bash scripts/bootstrap-disposable-testlab.sh

      - name: Download and verify CirrOS image
        id: image
        if: steps.bootstrap.outcome == 'success'
        continue-on-error: true
        env:
          CIRROS_IMAGE_URL: https://download.cirros-cloud.net/0.6.3/cirros-0.6.3-x86_64-disk.img
          CIRROS_IMAGE_SHA256: 7d6355852aeb6dbcd191bcda7cd74f1536cfe5cbf8a10495a7283a8396e4b75b
        run: |
          image_path="$(mktemp "${RUNNER_TEMP}/cirros-0.6.3-x86_64-disk.img.XXXXXX")"
          printf 'o3k-disposable-image-v1\nrun=%s\n' "${GITHUB_RUN_ID}" > "${image_path}.o3k-owned"
          chmod 0600 "${image_path}.o3k-owned"
          printf 'O3K_TESTLAB_IMAGE_PATH=%s\n' "${image_path}" >> "${GITHUB_ENV}"
          printf 'O3K_REAL_HOST_PROTECTED_PATHS<<O3K_PATHS_EOF\n%s\n%s\nO3K_PATHS_EOF\n' \
            "${O3K_REAL_HOST_PROTECTED_PATHS}" "${image_path}" >> "${GITHUB_ENV}"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
            --proto '=https' --tlsv1.2 \
            --output "${image_path}" "${CIRROS_IMAGE_URL}"
          printf '%s  %s\n' "${CIRROS_IMAGE_SHA256}" "${image_path}" \
            | sha256sum --check --strict --status
          chmod 0644 "${image_path}"

      - name: Probe runner capabilities
        id: capabilities
        if: steps.bootstrap.outcome == 'success' && steps.image.outcome == 'success'
        continue-on-error: true
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_REAL_HOST_RUNNER_LABELS: self-hosted,linux,x64,kvm,libvirt,o3k-testlab
          O3K_REAL_HOST_WORKFLOW_RUN_ID: ${{ github.run_id }}
          O3K_REAL_HOST_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          O3K_REAL_HOST_RUNNER_NAME: ${{ runner.name }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/real-host-capability-probe.sh

      - name: Pre-run host and trust guard
        id: guard
        if: always()
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_REAL_HOST_OPENSTACK_INVENTORY: true
          O3K_REAL_HOST_CAPABILITY_OUTPUT: target/real-host-workflow-artifacts/runner-capabilities.json
          O3K_REAL_HOST_WORKFLOW_RUN_ID: ${{ github.run_id }}
          O3K_REAL_HOST_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/real-host-pre-run-guard.sh

      - name: Run public real-host lifecycle
        id: lifecycle
        if: steps.guard.outputs.ready == 'true'
        continue-on-error: true
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_REAL_HOST_OPENSTACK_INVENTORY: true
          O3K_REAL_HOST_CAPABILITY_OUTPUT: target/real-host-workflow-artifacts/runner-capabilities.json
          O3K_TESTLAB_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_TESTLAB_CONFIG_DRIVE: true
          O3K_TESTLAB_CONSOLE_ATTEMPTS: 12
          # Keep the client watchdog outside the API's 15-second agent
          # dispatch budget so the API can return a terminal error response.
          O3K_TESTLAB_CONSOLE_REQUEST_TIMEOUT_SECONDS: 25
          O3K_AGENT_INSPECT_PROBE_RESOURCE_FILE: ${{ github.workspace }}/target/real-host-workflow-artifacts/agent-inspect-resource-id
        run: bash tests/testlab-libvirt.sh

      - name: Run compute-agent mTLS command evidence
        id: agent_mtls
        if: steps.guard.outputs.ready == 'true'
        continue-on-error: true
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
        run: bash tests/real-compute-agent-mtls.sh

      - name: Run compute-agent process-boundary evidence
        id: agent_process
        if: steps.guard.outputs.ready == 'true'
        continue-on-error: true
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
        run: bash tests/real-compute-agent-process-mtls.sh

      - name: Post-run result guard
        if: always()
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_REAL_HOST_OPENSTACK_INVENTORY: true
          O3K_REAL_HOST_WORKFLOW_STEP_STATUS: ${{ steps.lifecycle.outcome || 'skipped' }}
        run: bash scripts/real-host-post-run-guard.sh

      - name: Extract redacted create diagnostics
        if: always()
        run: |
          output=target/real-host-workflow-artifacts/create-diagnostics.log
          state_root="/var/lib/o3k-testlab/${GITHUB_RUN_ID}"
          {
            printf 'artifact_type=protected-create-diagnostics\n'
            printf 'source_commit=%s\n' "${GITHUB_SHA}"
            if sudo -n test -d "${state_root}/log"; then
              sudo -n sh -c \
                'grep -hE "server create reconciliation|artifact transfer|create reconciliation|agent create|create (request|command|artifact)|create artifacts" "$1"/log/*.log 2>/dev/null || true' \
                _ "${state_root}"
            else
              printf 'state_logs=unavailable\n'
            fi
          } >"${output}"
          chmod 0644 "${output}"

      - name: Stop and remove disposable TestLab
        if: always()
        run: bash scripts/cleanup-disposable-testlab.sh

      - name: Upload redacted real-host artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-host-workflow-artifacts
          path: |
            target/real-host-workflow-artifacts/runner-capabilities.json
            target/real-host-workflow-artifacts/disposable-testlab-bootstrap.json
            target/real-host-workflow-artifacts/real-host-owned-inventory-baseline.json
            target/real-host-workflow-artifacts/real-host-owned-inventory-after.json
            target/real-host-workflow-artifacts/real-host-workflow-result.json
            target/real-host-workflow-artifacts/resource-leak-result.json
            target/real-host-workflow-artifacts/libvirt-result.json
            target/real-host-workflow-artifacts/openstack-cli-result.json
            target/real-host-workflow-artifacts/console-result.json
            target/real-host-workflow-artifacts/console-file-size-evidence.txt
            target/real-host-workflow-artifacts/console-error.log
            target/real-host-workflow-artifacts/server-show-evidence.json
            target/real-host-workflow-artifacts/server-list-evidence.json
            target/real-host-workflow-artifacts/compute-agent-mtls-result.json
            target/real-host-workflow-artifacts/compute-agent-process-mtls-result.json
            target/real-host-workflow-artifacts/agent-inspect-resource-id
            target/real-host-workflow-artifacts/create-diagnostics.log
          if-no-files-found: warn
          retention-days: 14
