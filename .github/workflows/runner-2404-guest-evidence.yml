name: Runner 2404 guest evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    if: github.repository == 'kubedoio/o3k-rust' && github.ref == 'refs/heads/runner-2404-guest-evidence'
    runs-on: [self-hosted, linux, x64, kvm, libvirt, o3k-testlab]
    steps:
      - name: Capture exact guest evidence
        run: |
          set -euo pipefail
          artifact=target/guest-evidence
          mkdir -p "$artifact"
          domain=o3k-e84d69cce2c47ce8be64
          sudo -n virsh -c qemu:///system dumpxml "$domain" >"$artifact/domain.xml"
          sudo -n virsh -c qemu:///system domstate "$domain" >"$artifact/domain-state.txt"
          sudo -n virsh -c qemu:///system domblklist "$domain" >"$artifact/domain-blklist.txt"
          sudo -n virsh -c qemu:///system ttyconsole "$domain" >"$artifact/ttyconsole.txt" || true
          sudo -n virsh -c qemu:///system qemu-monitor-command "$domain" --hmp 'info status' >"$artifact/qemu-status.txt" || true
          sudo -n virsh -c qemu:///system qemu-monitor-command "$domain" --hmp 'info block' >"$artifact/qemu-block.txt" || true
          sudo -n virsh -c qemu:///system qemu-monitor-command "$domain" --hmp 'info cpus' >"$artifact/qemu-cpus.txt" || true
          pty="$(cat "$artifact/ttyconsole.txt" 2>/dev/null || true)"
          if [[ "$pty" == /dev/pts/[0-9]* ]]; then sudo -n timeout 5 cat "$pty" >"$artifact/serial-pty.txt" || true; fi
          sudo -n find /var/log/libvirt/qemu -maxdepth 1 -type f -name '*o3k*' -exec sh -c 'for f; do echo "--- $f"; tail -c 65536 "$f"; done' _ {} + >"$artifact/qemu-logs.txt" 2>/dev/null || true
          sudo -n ps -eo pid,user,stat,args --sort=pid | grep -E 'qemu-system|o3k-compute|o3kd' | grep -v grep >"$artifact/processes.txt" || true
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-2404-guest-evidence
          path: target/guest-evidence
          retention-days: 2
