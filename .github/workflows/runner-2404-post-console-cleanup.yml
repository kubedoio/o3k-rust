name: Runner 2404 post console cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    if: github.repository == 'kubedoio/o3k-rust' && github.ref == 'refs/heads/runner-2404-post-console-cleanup-2'
    runs-on: [self-hosted, linux, x64, kvm, libvirt, o3k-testlab]
    steps:
      - name: Remove exact owned resources
        run: |
          set -euo pipefail
          domain=o3k-e84d69cce2c47ce8be64
          if sudo -n virsh -c qemu:///system dominfo "$domain" >/dev/null 2>&1; then
            sudo -n virsh -c qemu:///system dumpxml "$domain" | grep -Fq '<o3k:domain'
            sudo -n virsh -c qemu:///system dumpxml "$domain" | grep -Fq 'managed_by="o3k-compute"'
            sudo -n virsh -c qemu:///system destroy "$domain" >/dev/null 2>&1 || true
            sudo -n virsh -c qemu:///system undefine "$domain"
          fi
          if ip link show dev o3k-br0 >/dev/null 2>&1; then
            if ip -o link show master o3k-br0 | awk '{print $2}' | grep -Ev '^(o3k-|o3ktap-)' >/dev/null; then exit 1; fi
            sudo -n ip link delete dev o3k-br0
          fi
