name: Cloud kernel positioning

on:
  push:
    branches:
      - docs/cloud-kernel-positioning

permissions:
  contents: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: docs/cloud-kernel-positioning
      - name: Update O3K public positioning
        run: |
          python3 -c "from pathlib import Path; p=Path('README.md'); t=p.read_text(); old='<p align=\"center\">\\n  <strong>Rust-native Cloud Operating System with an OpenStack-compatible northbound surface.</strong><br />\\n  OpenStack compatibility northbound. O3K Cloud Kernel in the middle. Typed infrastructure execution southbound.\\n</p>\\n'; new='<p align=\"center\">\\n  <strong>A cloud kernel — literally born in the cloud.</strong><br />\\n  Rust-native Cloud Operating System designed from first principles for cloud infrastructure.<br />\\n  OpenStack-compatible northbound. O3K-native cloud authority in the middle. Provider-neutral typed execution southbound.\\n</p>\\n'; assert old in t; t=t.replace(old,new,1); marker='![O3K Cloud Operating System architecture](docs/architecture/o3k-cloud-os.svg)\\n\\n'; addition='O3K is a **cloud kernel — literally born in the cloud**. It is built from scratch in Rust around a shared cloud authority rather than inherited service boundaries. The Cloud Kernel owns identity and authorization, resource ownership, desired state, operations, scheduling, reconciliation, quotas, audit/event identity, and failure semantics; compatibility APIs stay northbound and infrastructure execution stays southbound.\\n\\n'; assert marker in t; t=t if addition in t else t.replace(marker,marker+addition,1); p.write_text(t)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --check
          git commit -m 'docs: position O3K as the cloud kernel'
          git push origin HEAD:docs/cloud-kernel-positioning
