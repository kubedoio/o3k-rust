name: External Cinder Service Testbed

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cinder-testbed:
    name: External Cinder Service-Under-Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Run external Cinder service-under-test runner
        run: bash scripts/external-cinder-testbed-runner.sh
