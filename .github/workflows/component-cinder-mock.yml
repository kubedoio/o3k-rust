name: Mock Cinder Component Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cinder-mock:
    name: Mock Cinder Component Test (not a real Cinder deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Run mock Cinder component test
        run: bash scripts/component-cinder-mock.sh
